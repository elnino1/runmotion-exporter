name: Test

# From the github-ci skill (templates/test-ios-xcodegen.yml).
# iOS app whose Xcode project is generated by XcodeGen (project.yml, no committed .xcodeproj).
# - the project is generated before building;
# - the iPhone simulator is picked at run time (newest iOS runtime), so runner image updates
#   don't break the destination;
# - the newest stable Xcode is selected, the runner default may be older than the deployment target;
# - no code signing: CODE_SIGNING_ALLOWED=NO (works for free Apple ID / Personal Team apps);
# - SwiftLint job, with a baseline freezing pre-existing violations.
#
# Runs on every push (all branches). PRs opened by auto_pr.yml use GITHUB_TOKEN,
# which does not trigger `pull_request` workflows — the push run's status shows on the PR instead.
# Keep the name "Test": release.yml listens to it by name.
on:
  push:
    branches: [ "**" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Xcode Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Pick iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"

      - name: Build & Test
        run: |
          xcodebuild test -quiet \
            -project "runmotion_exporter.xcodeproj" \
            -scheme "runmotion_exporter" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v5

      # Pre-existing violations are frozen in .swiftlint-baseline.json: only new ones
      # (warnings included, --strict) fail the job.
      - name: SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging
