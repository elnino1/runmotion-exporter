name: runmotion_exporter
options:
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  runmotion_exporter:
    type: application
    platform: iOS
    sources:
      - path: runmotion_exporter/runmotion_exporter
        excludes:
          - "runmotion_exporter.entitlements"
      - path: runmotion_exporter/Shared
    dependencies:
      - target: runmotion_exporterShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: runmotion_exporter
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: runmotion_exporter/runmotion_exporter/runmotion_exporter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Lire l'état des entraînements programmés sur la montre"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Create running exercice from runmotion"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - runmotion_exporterTests
  runmotion_exporterShare:
    type: app-extension
    platform: iOS
    sources:
      - path: runmotion_exporter/runmotion_exporterShare
        excludes:
          - "Info.plist"
          - "runmotion_exporterShare.entitlements"
      - path: runmotion_exporter/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).share
        PRODUCT_NAME: runmotion_exporterShare
        INFOPLIST_FILE: runmotion_exporter/runmotion_exporterShare/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: runmotion_exporter/runmotion_exporterShare/runmotion_exporterShare.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "RunMotion Montre"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Lire l'état des entraînements programmés sur la montre"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Create running exercice from runmotion"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
  runmotion_exporterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: runmotion_exporter/runmotion_exporterTests
    dependencies:
      - target: runmotion_exporter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)Tests
        GENERATE_INFOPLIST_FILE: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
