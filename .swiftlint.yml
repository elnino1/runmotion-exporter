# SwiftLint — généré avec le skill ci-cd-setup (apple-skills) :
# templates/swiftlint/swiftlint.yml + fragments rules/swiftlint.yml de
# swift/code-size, swift/concurrency, security, ios/coding-best-practices,
# testing/tdd-feature.
#
# Code existant : les violations antérieures sont gelées dans
# .swiftlint-baseline.json ; la CI (et `swiftlint lint --strict --baseline …`)
# n'échoue que sur les nouvelles.

excluded:
  - .build
  - build
  - DerivedData
  - "**/Generated"
  - "*.xcodeproj"

opt_in_rules:
  - force_unwrapping
  - force_try
  - empty_count

disabled_rules: []

# --- swift/code-size ---
cyclomatic_complexity:
  warning: 10
  error: 20

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 5
  error: 8

custom_rules:
  # --- swift/concurrency ---
  unchecked_sendable:
    name: "@unchecked Sendable"
    message: "@unchecked Sendable silences the compiler's data-race checking — justify it with a same-line comment, or make the type actually Sendable."
    regex: '@unchecked Sendable(?![^\n]*//)'
    severity: warning

  # --- security ---
  hardcoded_secret_literal:
    name: "Hardcoded secret"
    message: "Secrets don't belong in source — use Keychain at runtime, or inject at build time (xcconfig/environment)."
    regex: '(?i)\b(apiKey|api_key|apiToken|api_token|authToken|auth_token|clientSecret|client_secret|bearerToken|accessToken|privateKey|password)\b\s*[:=]\s*"[A-Za-z0-9+/_.\-]{12,}"'
    severity: error
    excluded: ".*(Tests|Mocks|Fixtures|Previews?)/.*"

  # --- ios/coding-best-practices (cible iOS 26 : la règle @Observable s'applique) ---
  print_in_production:
    name: "print() in production code"
    message: "Use os.Logger — print() ships in release builds and leaks data into Console."
    regex: '^\s*print\('
    severity: warning
    excluded: ".*(Tests|UITests|Previews?|Playgrounds)/.*"
  observable_object_legacy:
    name: "ObservableObject (pre-@Observable)"
    message: "Use @Observable (iOS 17+/macOS 14+) with @State instead of ObservableObject."
    regex: 'class\s+\w+\s*:\s*(\w+\s*,\s*)*ObservableObject'
    severity: warning

  # --- testing/tdd-feature ---
  xctest_in_unit_tests:
    name: "XCTest in unit tests"
    message: "New unit tests use Swift Testing (import Testing). XCTest remains only for XCUITest UI-test targets."
    regex: '^import XCTest$'
    included: ".*Tests/.*"
    excluded: ".*UITests?/.*"
    severity: warning
